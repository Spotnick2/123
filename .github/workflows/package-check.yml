name: Package check

# Dry run only. Releases are built by CurseForge's own packager from the tag
# webhook, against the same .pkgmeta: this job exists so a packaging mistake
# surfaces on a pull request instead of in a published zip. (Gnomesweeper's recipe.)
#
# -d is the real no-upload switch: merely leaving CF_API_KEY out still lets the
# packager cut a GitHub release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run on a tag: the zip for the GitHub release (References/RELEASING.md)

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # The embedded libraries at the refs .pkgmeta pins (read from there,
      # never written twice), checked to BE those commits. The tests load them
      # from $LIBGLASS and $LIBSHOWCASE; the packager fetches the same pins
      # into Libs/.
      - name: Fetch the libraries at the pinned refs
        run: |
          bash tests/fetch_lib.sh LibGlass-1.0 "$RUNNER_TEMP/LibGlass"
          bash tests/fetch_lib.sh LibShowcase-1.0 "$RUNNER_TEMP/LibShowcase"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"
          echo "LIBSHOWCASE=$RUNNER_TEMP/LibShowcase" >> "$GITHUB_ENV"

      # WoW runs Lua 5.1, so the tests do too. tests/run.ps1 is the Windows entry
      # point for the same files. find, not globs: Libs/ nests deeper than one level.
      - name: Syntax-check every shipped Lua file
        run: |
          count=$(find . -name '*.lua' -not -path './.git/*' | wc -l)
          test "$count" -gt 0 || { echo "no Lua files found - the check would prove nothing"; exit 1; }
          echo "checking $count files"
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 luac5.1 -p

      - name: Unit tests
        env:
          FOREVERPROBE_OPTIONAL: "1"   # ForeverProbe is private and local: probe tests run locally
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # Pinned to a SHA, not the moving v2 tag (AltStable's: v2 has moved once already).
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip is what players install: assert its SHAPE rather than trusting
      # .pkgmeta to have been read the way it was meant.
      - name: The package has the addon, and nothing private
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          (cd unpacked && find . -type f | sed 's|^\./||' | sort) > files.txt
          echo "$(wc -l < files.txt) files in $zip"

          fail=0

          # What the client needs. Bindings.xml isn't in the TOC (the client finds
          # it by name), so nothing else would notice it missing.
          for f in 123/123.toc                    123/Bindings.xml                    123/LICENSE                    123/Libs/LibStub/LibStub.lua                    123/Libs/LibStub/LICENSE.txt 123/Libs/CallbackHandler-1.0/LICENSE.txt                    123/Libs/LibDBIcon-1.0/LICENSE.txt; do
            grep -qx "$f" files.txt || { echo "MISSING from the package: $f"; fail=1; }
          done

          # Every file the TOC lists ships.
          for f in $(grep -vE '^\s*(#|$)' 123.toc | tr -d '\r' | tr '\\' '/'); do
            grep -qx "123/$f" files.txt || { echo "MISSING (listed in the TOC): $f"; fail=1; }
          done

          # Development files must not ship.
          for pat in '/tests/' '/Tools/' '/docs/' '/\.github/' '/\.claude/' '/Media/Source/' \
                     'AGENTS\.md$' 'CLAUDE\.md$' 'CHANGELOG\.md$' 'README\.md$' \
                     '\.png$' '\.py$' '\.ps1$'; do
            if grep -qE "$pat" files.txt; then
              echo "SHOULD NOT be in the package ($pat):"
              grep -E "$pat" files.txt
              fail=1
            fi
          done

          # @project-version@ substituted, and no literal version committed over it.
          tocs=$(grep -cE '\.toc$' files.txt || true)
          test "$tocs" -eq 1 || { echo "expected 1 TOC in the package, found $tocs"; fail=1; }
          v=$(grep -i '^## Version:' unpacked/123/123.toc | head -1)
          echo "123.toc  ->  $v"
          case "$v" in
            "")                    echo "  no Version line at all"; fail=1 ;;
            *"@project-version@"*) echo "  keyword not substituted"; fail=1 ;;
            *dev*)                 echo "  a dev version was committed over the keyword"; fail=1 ;;
          esac

          exit $fail

      # Under Libs/<Lib>-1.0, exactly what each library ships: its XML, every
      # file the XML loads, LICENSE, Media/*.tga, and NOTHING else (its tests,
      # docs, Tools or a new notes file fail here instead of shipping). And none
      # of its textures left in our own Media/.
      - name: The package holds exactly the libraries' runtime files
        run: |
          fail=0
          for pair in "LibGlass-1.0:$LIBGLASS" "LibShowcase-1.0:$LIBSHOWCASE"; do
            name=${pair%%:*}; src=${pair#*:}
            lib=123/Libs/$name
            {
              echo "$lib/$name.xml"
              echo "$lib/LICENSE"
              # Comments stripped non-greedily, as the test harness does.
              tr -d '\r' < "$src/$name.xml" | perl -0pe 's/<!--.*?-->//gs' |
                sed -n 's/.*<Script file="\([^"]*\)".*/\1/p' | tr '\\' '/' | sed "s|^|$lib/|"
              (cd "$src" && ls Media/*.tga 2>/dev/null || true) | sed "s|^|$lib/|"
            } | sort > expected.txt
            (cd unpacked && find . -type f | sed 's|^\./||' | sort) | grep "^$lib/" > actual.txt || true
            echo "$name files expected: $(wc -l < expected.txt) ($(grep -c "^$lib/Media/" expected.txt || true) textures)"
            if ! diff -u expected.txt actual.txt; then
              echo "the packaged $name differs from what it ships (- missing, + extra)"
              fail=1
            fi
            stale=$( (cd "$src" && ls Media/*.tga 2>/dev/null || true) | while read -r t; do
              if [ -e "unpacked/123/$t" ]; then echo "$t"; fi; done )
            if [ -n "$stale" ]; then
              echo "$name textures also in 123/Media/: $stale"; fail=1
            fi
          done
          exit $fail

      # The packager fetched its own copies of the libraries; prove it embedded
      # the pinned commits' content (the same files the tests just ran against).
      # Its text filter rewrites .lua/.xml with CRLF, so those compare with CRs
      # stripped; everything else (textures, LICENSE) must match byte for byte.
      - name: The packaged libraries are the pinned commits
        run: |
          bad=0
          for pair in "LibGlass-1.0:$LIBGLASS" "LibShowcase-1.0:$LIBSHOWCASE"; do
            name=${pair%%:*}; src=${pair#*:}
            lib=unpacked/123/Libs/$name
            while read -r f; do
              case "$f" in
                *.lua|*.xml) cmp -s <(tr -d '\r' < "$lib/$f") <(tr -d '\r' < "$src/$f") ;;
                *) cmp -s "$lib/$f" "$src/$f" ;;
              esac || { echo "$name differs from the pinned checkout: $f"; bad=1; }
            done < <(cd "$lib" && find . -type f | sed 's|^\./||')
          done
          test "$bad" -eq 0

      # .release is hidden, and upload-artifact@v4 skips hidden content unless
      # told otherwise: without this the upload finds nothing and stays green.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: 123-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
