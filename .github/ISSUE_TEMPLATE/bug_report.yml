name: Bug report
description: Something in 123 doesn't work, looks wrong, or shows a Lua error.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 123 version
      description: From the AddOns list.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: Solo, party or raid; in combat or not; which demon was out; which stone.
  - type: textarea
    id: error
    attributes:
      label: Lua error (if any)
      description: Turn errors on with `/console scriptErrors 1`, or use BugSack. Paste the whole error, the stack included.
      render: text
